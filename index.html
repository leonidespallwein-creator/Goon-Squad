<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOON SQUAD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Sammelkarten-Rangliste auf Papier, eine feste Optik in beiden Themes */
  :root {
    --papier: #f4e9c8;
    --punkt: #d9c99a;
    --tinte: #1b1b1b;
    --gelb: #ffd23f;
    --rot: #e63b2e;
    --weiss: #ffffff;
    --feld: #fffdf5;
    --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
    --marker: 'Permanent Marker', 'Comic Sans MS', cursive;
    --mono: 'Space Mono', 'Courier New', monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--papier);
    color: var(--tinte);
    font-family: var(--mono);
    font-size: 15px;
    background-image: radial-gradient(var(--punkt) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  header {
    background: var(--tinte);
    color: var(--papier);
    text-align: center;
    padding: 46px 16px 70px;
    border-bottom: 8px solid var(--rot);
  }
  header h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(56px, 14vw, 150px);
    margin: 0;
    letter-spacing: 4px;
    line-height: 1;
    color: var(--gelb);
    text-shadow: 6px 6px 0 var(--rot);
  }
  .untertitel {
    font-family: var(--marker);
    font-size: 22px;
    margin-top: 14px;
    transform: rotate(-2deg);
  }
  .zettel {
    max-width: 600px;
    margin: -35px 16px 0;
    background: var(--rot);
    color: var(--weiss);
    padding: 18px 20px;
    text-align: center;
    border: 3px solid var(--tinte);
    box-shadow: 6px 6px 0 var(--tinte);
    transform: rotate(1deg);
    position: relative;
  }
  @media (min-width: 640px) { .zettel { margin-inline: auto; } }
  .knopfreihe { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .knopf {
    display: inline-block;
    background: var(--gelb);
    color: var(--tinte);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    padding: 8px 16px;
    border: 3px solid var(--tinte);
    cursor: pointer;
  }
  .knopf:hover { background: var(--weiss); }
  .knopf:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px dashed var(--tinte); outline-offset: 3px;
  }
  .linkfeld {
    margin-top: 10px;
    font-size: 12px;
    word-break: break-all;
    user-select: all;
    background: var(--tinte);
    color: var(--papier);
    padding: 6px 8px;
  }
  .hinweis { font-size: 13px; margin-top: 8px; min-height: 1em; }
  h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 42px;
    text-align: center;
    margin: 64px 16px 10px;
    letter-spacing: 2px;
  }
  .karten {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px;
    padding: 30px 16px 70px;
  }
  .karte {
    width: 300px;
    max-width: 100%;
    background: var(--weiss);
    border: 3px solid var(--tinte);
    box-shadow: 8px 8px 0 var(--tinte);
    position: relative;
    transition: transform 0.2s;
  }
  .karte:nth-child(3n+1) { transform: rotate(-2deg); }
  .karte:nth-child(3n+2) { transform: rotate(1.5deg); }
  .karte:nth-child(3n+3) { transform: rotate(-1deg); }
  .karte:hover { transform: rotate(0) scale(1.04); }
  @media (prefers-reduced-motion: reduce) { .karte { transition: none; } }
  .platz {
    position: absolute; top: -18px; left: -18px;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--gelb); border: 3px solid var(--tinte);
    font-family: var(--display); font-size: 26px;
    display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .neu {
    position: absolute; top: 10px; right: -10px; z-index: 2;
    background: var(--rot); color: var(--weiss);
    font-family: var(--marker); font-size: 14px;
    padding: 2px 10px; border: 2px solid var(--tinte);
    transform: rotate(6deg);
  }
  .karte img {
    width: 100%; height: 340px; object-fit: cover; display: block;
    border-bottom: 3px solid var(--tinte); background: var(--punkt);
  }
  .info { padding: 14px 16px 18px; }
  .name { font-family: var(--display); font-size: 28px; margin: 0; line-height: 1.1; overflow-wrap: anywhere; }
  .details { font-size: 13px; margin-top: 6px; }
  .motivation { font-size: 13px; font-style: italic; margin-top: 8px; overflow-wrap: anywhere; }
  .record {
    margin-top: 10px; display: flex; justify-content: space-between; align-items: baseline;
    border-top: 2px dashed var(--tinte); padding-top: 10px;
  }
  .record span { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .record strong { font-family: var(--display); font-weight: 400; font-size: 40px; color: var(--rot); font-variant-numeric: tabular-nums; }
  .weg { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; align-items: center; }
  .weg button {
    font-family: var(--mono); font-size: 12px; padding: 4px 8px; cursor: pointer;
    background: var(--tinte); color: var(--weiss); border: 2px solid var(--tinte);
  }
  .weg button.ja { background: var(--rot); }
  .weg button.nein { background: var(--weiss); color: var(--tinte); }

  .formular {
    max-width: 560px; margin: 0 16px 70px;
    background: var(--weiss); border: 3px solid var(--tinte);
    box-shadow: 8px 8px 0 var(--tinte); padding: 24px;
  }
  @media (min-width: 600px) { .formular { margin-inline: auto; } }
  .bedingung {
    background: var(--gelb); border: 3px solid var(--tinte);
    padding: 12px 16px; margin-bottom: 20px; transform: rotate(-1deg);
  }
  .bedingung b { font-family: var(--marker); font-size: 18px; font-weight: 400; }
  .formular label { display: block; font-weight: 700; margin: 18px 0 6px; }
  .stern { color: var(--rot); }
  .formular input[type="text"], .formular select, .formular textarea {
    width: 100%; font-family: var(--mono); font-size: 16px; padding: 10px;
    border: 3px solid var(--tinte); background: var(--feld); color: var(--tinte);
  }
  .formular textarea { min-height: 80px; resize: vertical; }
  .foto-feld { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .foto-feld input { min-width: 0; max-width: 100%; }
  #vorschau { width: 90px; height: 110px; object-fit: cover; border: 3px solid var(--tinte); }
  .formular .absenden {
    margin-top: 24px; width: 100%; font-size: 18px; padding: 12px;
    background: var(--rot); color: var(--weiss);
  }
  .formular .absenden:hover { background: var(--tinte); }
  .formular .absenden:disabled { opacity: 0.6; cursor: wait; }
  .meldung { margin-top: 14px; font-weight: 700; text-align: center; min-height: 1.2em; }
  .gesperrt { text-align: center; font-weight: 700; padding: 10px; }
  footer { text-align: center; padding: 20px 16px; font-size: 13px; background: var(--tinte); color: var(--papier); }
</style>
</head>
<body>

<header>
  <h1>GOON SQUAD</h1>
  <div class="untertitel">die offizielle Rangliste</div>
</header>

<div class="zettel">
  Neu dabei? Melde dich an oder schick die Seite deinen Freunden:
  <div class="knopfreihe">
    <a class="knopf" href="#anmelden">Zur Anmeldung ↓</a>
    <button class="knopf" id="kopieren" type="button">Link kopieren</button>
    <a class="knopf" id="whatsapp" href="#" target="_blank" rel="noopener">Per WhatsApp schicken</a>
  </div>
  <div class="linkfeld" id="linkfeld"></div>
  <div class="hinweis" id="kopiert"></div>
</div>

<h2>DIE SPIELER</h2>
<div class="karten" id="karten"></div>

<h2 id="anmelden">ANMELDUNG</h2>

<form class="formular" id="formular">
  <div class="bedingung">
    <b>Teilnahme Bedingung:</b><br>
    Gooner · Pooner · Jooner
  </div>
  <div id="felder">
    <p style="font-size:13px;margin:0;"><span class="stern">*</span> = Pflichtfeld</p>

    <label for="name">Name <span class="stern">*</span></label>
    <input type="text" id="name" maxlength="30" required>

    <label for="record">Record? <span class="stern">*</span></label>
    <select id="record" required>
      <option value="">-- auswählen --</option>
      <option>0</option><option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option><option>6</option><option>7</option>
      <option>8</option><option>9</option><option>10</option>
      <option value="123">123 (aktueller Rekord)</option>
    </select>

    <label for="alter">Alter <span class="stern">*</span></label>
    <select id="alter" required>
      <option value="">-- auswählen --</option>
      <option>14</option><option>16</option><option>24</option><option>ka</option>
    </select>

    <label for="motivation">Motivation</label>
    <textarea id="motivation" maxlength="150"></textarea>

    <label for="foto">Foto <span class="stern">*</span></label>
    <div class="foto-feld">
      <input type="file" id="foto" accept="image/*" required>
      <img id="vorschau" alt="Vorschau von deinem Foto" hidden>
    </div>

    <button type="submit" class="knopf absenden" id="absenden">ANMELDEN</button>
  </div>
  <div class="meldung" id="meldung"></div>
</form>

<footer>GOON SQUAD · seit 2026</footer>

  var neue = [];
  var fotoBlob = null;

  // ---------- Teilen ----------
  document.getElementById("linkfeld").textContent = SEITEN_LINK;
  document.getElementById("whatsapp").href =
    "https://wa.me/?text=" + encodeURIComponent("Meld dich beim GOON SQUAD an: " + SEITEN_LINK);
  document.getElementById("kopieren").addEventListener("click", function () {
    var info = document.getElementById("kopiert");
    navigator.clipboard.writeText(SEITEN_LINK).then(function () {
      info.textContent = "Link kopiert! Jetzt einfach einfügen und abschicken.";
    }).catch(function () {
      var r = document.createRange();
      r.selectNodeContents(document.getElementById("linkfeld"));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      info.textContent = "Link ist markiert – mit Strg+C kopieren.";
    });
  });

  // ---------- Karten ----------
  function karte(s, platz) {
    var el = document.createElement("div");
    el.className = "karte";

    var p = document.createElement("div");
    p.className = "platz"; p.textContent = platz;
    el.appendChild(p);

    if (s.neu) {
      var n = document.createElement("div");
      n.className = "neu"; n.textContent = "neu!";
      el.appendChild(n);
    }

    var img = document.createElement("img");
    img.src = s.foto; img.alt = s.name; img.loading = "lazy";
    el.appendChild(img);

    var info = document.createElement("div");
    info.className = "info";
    var name = document.createElement("p");
    name.className = "name"; name.textContent = s.name;
    info.appendChild(name);

    if (s.alter) {
      var d = document.createElement("div");
      d.className = "details"; d.textContent = "Alter: " + s.alter;
      info.appendChild(d);
    }
    if (s.motivation) {
      var m = document.createElement("div");
      m.className = "motivation"; m.textContent = "„" + s.motivation + "“";
      info.appendChild(m);
    }

    var r = document.createElement("div");
    r.className = "record";
    r.innerHTML = "<span>Record</span><strong></strong>";
    r.querySelector("strong").textContent = String(s.record).replace(".", ",");
    info.appendChild(r);

    el.appendChild(info);
    return el;
  }

  function zeigen() {
    var alle = gruender.concat(neue);
    alle.sort(function (a, b) { return b.record - a.record; });
    var box = document.getElementById("karten");
    box.innerHTML = "";
    alle.forEach(function (s, i) { box.appendChild(karte(s, i + 1)); });
  }

  async function laden() {
    var res = await supa.from("spieler").select("*").order("erstellt");
    if (res.error) return;
    neue = res.data.map(function (x) {
      return { neu: true, name: x.name, record: Number(x.record), alter: x.alter_,
               motivation: x.motivation, foto: x.foto_url };
    });
    zeigen();
  }

  // ---------- Foto verkleinern ----------
  document.getElementById("foto").addEventListener("change", function () {
    var datei = this.files[0];
    var vorschau = document.getElementById("vorschau");
    fotoBlob = null; vorschau.hidden = true;
    if (!datei) return;
    var leser = new FileReader();
    leser.onload = function (e) {
      var bild = new Image();
      bild.onload = function () {
        var faktor = Math.min(1, 700 / Math.max(bild.width, bild.height));
        var c = document.createElement("canvas");
        c.width = Math.round(bild.width * faktor);
        c.height = Math.round(bild.height * faktor);
        c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
        vorschau.src = c.toDataURL("image/jpeg", 0.8);
        vorschau.hidden = false;
        c.toBlob(function (b) { fotoBlob = b; }, "image/jpeg", 0.8);
      };
      bild.onerror = function () {
        document.getElementById("meldung").textContent = "Das Foto konnte nicht gelesen werden. Nimm ein JPG oder PNG.";
      };
      bild.src = e.target.result;
    };
    leser.readAsDataURL(datei);
  });

  // ---------- Anmelden ----------
  document.getElementById("formular").addEventListener("submit", async function (e) {
    e.preventDefault();
    var form = e.target;
    var meldung = document.getElementById("meldung");
    if (!fotoBlob) { meldung.textContent = "Bitte wähl ein Foto aus und warte, bis die Vorschau erscheint."; return; }

    var knopf = document.getElementById("absenden");
    knopf.disabled = true;
    meldung.textContent = "Wird gespeichert …";

    try {
      var pfad = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
      var hoch = await supa.storage.from("fotos").upload(pfad, fotoBlob, { contentType: "image/jpeg" });
      if (hoch.error) throw hoch.error;
      var url = supa.storage.from("fotos").getPublicUrl(pfad).data.publicUrl;

      var eintrag = await supa.from("spieler").insert({
        name: document.getElementById("name").value.trim().toUpperCase(),
        record: Number(document.getElementById("record").value),
        alter_: document.getElementById("alter").value,
        motivation: document.getElementById("motivation").value.trim() || null,
        foto_url: url
      });
      if (eintrag.error) throw eintrag.error;

      form.reset();
      fotoBlob = null;
      document.getElementById("vorschau").hidden = true;
      meldung.textContent = "Willkommen im GOON SQUAD! Deine Karte ist jetzt oben bei den Spielern.";
      await laden();
      document.getElementById("karten").scrollIntoView({ behavior: "smooth" });
    } catch (err) {
      meldung.textContent = "Speichern hat nicht geklappt. Versuch es gleich nochmal.";
    }
    knopf.disabled = false;
  });

  zeigen();
  laden();
</script>
</body>
</html>
